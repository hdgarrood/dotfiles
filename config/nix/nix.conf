# Wait at least 5s and at most 10s for each attempt to connect to a remote
# server, with 5 attempts max
initial-connect-timeout = 5
max-connect-timeout = 10
download-attempts = 5

# perform a gc if available space drops below 10 GiB during a build
min-free = 10737418240
# ... and keep going until there is 20 GiB free
max-free = 21474836480
