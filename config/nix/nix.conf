# Wait at least 5s and at most 10s for each attempt to connect to a remote
# server, with 5 attempts max
initial-connect-timeout = 5
max-connect-timeout = 10
download-attempts = 5

# perform a gc if available space drops below 20 GiB during a build
min-free = 21474836480
# ... and keep going until there is 70 GiB free
max-free = 75161927680

max-jobs = auto
extra-experimental-features = nix-command flakes
tarball-ttl = 86400  # 1 day
warn-dirty = false
